services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: smeta_app
    restart: unless-stopped
    environment:
      PLAYWRIGHT_BROWSERS_PATH: /root/.cache/ms-playwright
    volumes:
      - ./server:/var/www/html
      - ./parser:/var/www/html/parser
      - ./storage/app/public:/var/www/html/storage/app/public
      - node_modules:/var/www/html/node_modules
      - playwright_browsers:/root/.cache/ms-playwright
    networks:
      - smeta-network
    healthcheck:
      test: ["CMD", "php", "-v"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    image: nginx:alpine
    container_name: smeta_web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - ./docker/app/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./server/public/price-indices-public-calculator.js:/var/www/assets/price-indices-public-calculator.js:ro
      - ./server/public/price-indices-public-chart.js:/var/www/assets/price-indices-public-chart.js:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - smeta-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: smeta_pma
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    environment:
      PMA_HOST: db
      PMA_USER: smeta_user
      PMA_PASSWORD: smeta_pass
    depends_on:
      db:
        condition: service_started
    networks:
      - smeta-network

  db:
    image: mariadb:10.6
    container_name: smeta_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: smeta_expert
      MYSQL_USER: smeta_user
      MYSQL_PASSWORD: smeta_pass
    volumes:
      - smeta_db_data:/var/lib/mysql
    networks:
      - smeta-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: smeta_worker
    restart: unless-stopped
    environment:
      PLAYWRIGHT_BROWSERS_PATH: /root/.cache/ms-playwright
    volumes:
      - ./server:/var/www/html
      - ./parser:/var/www/html/parser
      - ./storage/app/public:/var/www/html/storage/app/public
      - node_modules:/var/www/html/node_modules
      - playwright_browsers:/root/.cache/ms-playwright
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - smeta-network

volumes:
  smeta_db_data:
  playwright_browsers:
  node_modules:

networks:
  smeta-network:
    driver: bridge
